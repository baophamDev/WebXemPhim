name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huỷ các lần chạy PR cũ khi push liên tiếp. Với main thì không huỷ,
# tránh cắt ngang một lần deploy đang chạy.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint tách khỏi job build và KHÔNG chặn deploy: cấu hình ESLint được viết
  # offline nên lần chạy thật đầu tiên chính là ở đây. Khi job này đã xanh, đổi
  # `needs: build` của hai job deploy thành `needs: [build, lint]` để nó chặn.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci cài đúng theo package-lock.json cho toàn bộ workspaces
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Không cần mạng hay DB: bộ lọc quảng cáo m3u8 chạy trên playlist tự dựng,
      # còn test của apps/web chỉ đọc index.html + boot.ts để so URL.
      - name: Test
        run: npm test

      # Build cả services/api (tsc) và apps/web (tsc -b + vite build)
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  # APK Android: bản "local app" — giao diện nằm trong APK, không tải từ Vercel.
  #
  # Job này KHÔNG chặn deploy (hai job deploy chỉ cần `build`) và cũng không cần
  # secret nào: bản debug tự ký bằng khoá debug sinh trên runner. Bản cài thật nên
  # build bằng `build-apk.cmd` ở máy nhà — bản đó ký bằng khoá riêng, và hai khoá
  # khác nhau thì Android coi là hai app: cài bản này lên bản kia phải gỡ trước.
  #
  # Chỉ dựng `assembleDebug` vì runner không có `android/keystore.jks` (đã gitignore
  # — khoá ký không được nằm trong repo). APK ở đây để cài thử, không phải để phát
  # hành.
  apk:
    name: Build APK (Android)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.7 chạy trên JDK 17; JDK 21+ của runner mặc định sẽ làm Gradle 8.9 đổ.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cùng thứ tự ưu tiên với scripts/build-apk.mjs: biến của repo nếu có, không
      # thì API production trên Railway. Bên trong APK không có proxy nào nên địa
      # chỉ phải tuyệt đối.
      - name: Build web (nhét vào APK)
        run: npm run build --workspace apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://webxemphim-production-2d70.up.railway.app/api' }}

      - name: Copy web build vào assets của APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -r apps/web/dist/. android/app/src/main/assets/web/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # chmod vì gradlew sinh ra trên Windows (build-apk.cmd) nên bit thực thi không
      # có trong git; trên Linux phải bật lại mới chạy được.
      - name: Dựng APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaoNhanCinema-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # CD: chỉ chạy khi push vào main và job build đã pass.
  # Trước khi bật, hãy TẮT auto-deploy phía Railway/Vercel để không deploy 2 lần.
  # ---------------------------------------------------------------------------

  deploy-api:
    name: Deploy API (Railway)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Thiếu secret thì bỏ qua thay vì fail với lỗi khó hiểu
      - name: Check secrets
        id: guard
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa có secret RAILWAY_TOKEN — bỏ qua deploy API."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TODO: pin version cụ thể (vd @railway/cli@3.x) sau lần chạy đầu thành công
      - name: Install Railway CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm i -g @railway/cli@latest

      # Railway build lại theo railway.json (nixpacks) rồi chạy healthcheck /api/health
      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE || 'api' }}"

  deploy-web:
    name: Deploy Web (Vercel)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Thiếu secret Vercel — bỏ qua deploy web."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TODO: pin version cụ thể sau lần chạy đầu thành công
      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm i -g vercel@latest

      # pull kéo env production của project về, nên VITE_* cấu hình trong Vercel vẫn áp dụng
      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$TOKEN"
          vercel build --prod --token="$TOKEN"
          vercel deploy --prebuilt --prod --token="$TOKEN"

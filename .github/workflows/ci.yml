name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huỷ các lần chạy cũ khi push liên tiếp lên cùng một branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci cài đúng theo package-lock.json cho toàn bộ workspaces
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build cả services/api (tsc) và apps/web (tsc -b + vite build)
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

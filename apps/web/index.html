<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0806" />
    <meta name="description" content="Rạp phim riêng của gia đình: tìm phim theo tên, theo diễn viên, xem tiếp từ chỗ đang dở." />
    <title>BảoNhànCinema</title>

    <!-- Mở sẵn kết nối tới nguồn phim gọi thẳng từ trình duyệt (không còn backend):
         host dữ liệu NguonC/KKPhim và host ảnh của chúng. Request đầu tiên phải trả
         tiền DNS + TCP + TLS; làm sớm ở đây thì khoản đó tiêu hoá xong trong lúc
         trình duyệt còn tải bundle. -->
    <link rel="preconnect" href="https://phim.nguonc.com" crossorigin />
    <link rel="preconnect" href="https://img.nguonc.com" crossorigin />
    <link rel="preconnect" href="https://phimapi.com" crossorigin />
    <link rel="preconnect" href="https://phimimg.com" crossorigin />

    <!-- Trước đây có một khối <script> bắn sẵn request API lúc đọc HTML
         (window.__BOOT__). Đã bỏ: không còn backend, dữ liệu lấy thẳng từ nguồn
         trong `src/sources.ts`, không có round-trip API nào để chạy trước. -->

    <!-- Mở sẵn kết nối tới host ảnh (poster/thumb hotlink từ nguồn phim).
         Ảnh là thứ nặng nhất trang chủ: không có preconnect thì mỗi ảnh đầu
         phải trả thêm DNS + TCP + TLS trước khi tải được byte nào. -->
    <link rel="preconnect" href="https://vsmov.com" crossorigin />


    <!-- Font tải qua <link> chứ không @import trong CSS: @import chặn render vì
         trình duyệt phải tải xong CSS mới biết cần font nào.
         Anton chỉ dùng cho tiêu đề hero khổ lớn (có subset vietnamese). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Lớp điều khiển TV (D-pad + phím riêng của điều khiển LG). Ba quyết định ở
      đây đều có lý do, đổi là hỏng:

      - Nạp từ trang chứ không chèn lúc đóng gói: app trên TV LG là "hosted web
        app", appinfo.json trỏ `main` vào đúng URL này nên không còn bước đóng gói
        nào để chèn script vào — trang phải tự nạp lấy.
      - Đặt ở CUỐI <body>: lúc này <head> đã parse xong nên link CSS thêm vào head
        nằm sau file CSS của app và đè được. Để trong <head> thì tv.css chèn trước
        CSS của Vite, mọi override focus mất tác dụng mà không có lỗi nào.
      - Chỉ nạp khi đúng là TV: máy tính và điện thoại không tải thêm byte nào.

      Thử trên máy tính: thêm ?tv=1 vào URL rồi bấm mũi tên (focus sẽ nhảy ô).
    -->
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        // Web0S (chữ số 0, không phải chữ O) là UA của LG từ webOS 3 trở lên;
        // NetCast là dòng TV LG trước 2014. window.PalmSystem là object webOS bơm
        // vào mọi app đã cài nên vẫn nhận ra được khi UA bị đổi.
        //
        // CinemaTV là dấu do vỏ Android tự thêm vào UA khi chạy trên Android TV
        // (xem android/app/src/main/java/com/localcinema/android/MainActivity.java).
        // Cần đến nó vì `?tv=1` chỉ sống ở lần nạp đầu: đi sang trang phim rồi
        // tải lại là query biến mất, còn UA thì không.
        var onTv = /Web0S|webOS|NetCast|SmartTV|SMART-TV|HbbTV|CinemaTV/i.test(ua)
          || !!window.PalmSystem
          || /(^|[?&])tv=1(&|$)/.test(location.search);
        if (!onTv) return;

        // Dấu hiệu để biết nhánh này đã chạy — trên TV không mở DevTools dễ như
        // trên máy tính, có cái nhìn được bằng ares-inspect thì đỡ đoán.
        document.documentElement.setAttribute('data-tv', '');

        var styles = ['tv.css', 'webos.css'];
        for (var i = 0; i < styles.length; i++) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/tv/' + styles[i];
          document.head.appendChild(link);
        }

        // async = false là phần bắt buộc: script chèn bằng JS mặc định chạy ngay
        // khi tải xong (không theo thứ tự), mà webos-keys.js cần window.__tv do
        // tv-remote.js tạo ra. Cờ này buộc chúng chạy đúng thứ tự chèn.
        var scripts = ['tv-remote.js', 'webos-keys.js'];
        for (var k = 0; k < scripts.length; k++) {
          var script = document.createElement('script');
          script.src = '/tv/' + scripts[k];
          script.async = false;
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
